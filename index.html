<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misty Poolvilla</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        
        <header class="hero">
            <div class="hero-box">
                <h1>Misty Field Poolvilla</h1>
                <p class="sub-title">EXPERIENCE RARE LUXURY</p>
            </div>
        </header>

        <div class="content-row">
            
            <div class="slider-wrapper">
                <div class="gallery-slider" id="gallerySlider">
                    <div class="slide-item"><img src="images/room_1.1.jpg" alt="Misty Poolvilla 1" onclick="openLightbox(this.src)"></div>
                    <div class="slide-item"><img src="images/room_2.jpg" alt="Misty Poolvilla 2" onclick="openLightbox(this.src)"></div>
                    <div class="slide-item"><img src="images/room_3.jpg" alt="Misty Poolvilla 3" onclick="openLightbox(this.src)"></div>
                    <div class="slide-item"><img src="images/room_4.jpg" alt="Misty Poolvilla 4" onclick="openLightbox(this.src)"></div>
                </div>
                <button class="slider-btn prev" onclick="moveSlider(-1)">&#10094;</button>
                <button class="slider-btn next" onclick="moveSlider(1)">&#10095;</button>
            </div>

            <div class="price-card">
                <h2>ราคาที่พัก</h2>
                
                <div class="room-selector">
                    <button class="room-btn active" onclick="scrollToRoom(0)">ห้องที่ 1</button>
                    <button class="room-btn" onclick="scrollToRoom(1)">ห้องที่ 2</button>
                    <button class="room-btn" onclick="scrollToRoom(2)">ห้องที่ 3</button>
                    <button class="room-btn" onclick="scrollToRoom(3)">ห้องที่ 4</button>
                </div>

                <div class="price-list">
                    <p><span>📅 จันทร์ - พฤหัสบดี :</span> <b>6,900 บาท</b></p>
                    <p><span>📅 ศุกร์ - อาทิตย์ :</span> <b>8,500 บาท</b></p>
                    <p><span>⭐ วันเสาร์ - นักขัตฤกษ์ :</span> <b>10,000 บาท</b></p>
                </div>
            </div>

        </div> <div class="btn-group">
            <a class="btn fb" href="https://www.facebook.com/mistyfieldpoolvilla" target="_blank">
                📘 Facebook
            </a>
            <a class="btn line" href="https://lin.ee/RWJQMLN" target="_blank">
                💬 Line
            </a>
            <a class="btn phone" href="tel:0843410869">
                📞 โทร: 084-341-0869
            </a>
        </div>

        <h2 class="calendar-title">📅 ปฏิทินวันว่าง / วันจอง </h2>
<div class="calendar">
    <!-- 
       📌 ข้อควรระวัง: 
       - ปฏิทินแรก (วันจอง): สีแดง (#e74c3c) ใช้โค้ดสีใน URL เป็น %23e74c3c
       - ปฏิทินสอง (ราคา): สีเขียว (#2ecc71) ใช้โค้ดสีใน URL เป็น %232ecc71
       - เปลี่ยนเครื่องหมาย @ ในรหัสปฏิทินอันใหม่ของคุณให้กลายเป็น %40 ด้วยนะครับ
    -->
    <iframe src="https://calendar.google.com/calendar/embed?src=7848fff8f64f96da3356f5681554ed8e0a9bd2cf71933aed63a58861132c449b%40group.calendar.google.com&amp;color=%23007fff&amp;src=114f5d0470d1d485a4710ddc0039eaf0df346f998b00d7f1600767af3f5d3f52@group.calendar.google.com&amp;color=%23e74c3c&amp;ctz=Asia%2FBangkok"></iframe>
</div>


    </div> <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Enlarged View">
    </div>

    <script>
        const slider = document.getElementById('gallerySlider');

        function scrollToRoom(index) {
            const items = slider.querySelectorAll('.slide-item');
            if(items[index]) {
                const itemWidth = items[index].clientWidth + 15; 
                slider.scrollTo({
                    left: index * itemWidth,
                    behavior: 'smooth'
                });
                updateActiveButton(index);
            }
        }

        function moveSlider(direction) {
            const items = slider.querySelectorAll('.slide-item');
            const itemWidth = items[0].clientWidth + 15;
            
            let currentIndex = Math.round(slider.scrollLeft / itemWidth);
            let nextIndex = currentIndex + direction;

            if (nextIndex >= 0 && nextIndex < items.length) {
                slider.scrollTo({
                    left: nextIndex * itemWidth,
                    behavior: 'smooth'
                });
                updateActiveButton(nextIndex);
            }
        }

        function updateActiveButton(index) {
            const buttons = document.querySelectorAll('.room-btn');
            buttons.forEach((btn, i) => {
                if(i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        slider.addEventListener('scroll', () => {
            const items = slider.querySelectorAll('.slide-item');
            if(items.length > 0) {
                const itemWidth = items[0].clientWidth + 15;
                const currentIndex = Math.round(slider.scrollLeft / itemWidth);
                updateActiveButton(currentIndex);
            }
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
            lightboxImg.src = '';
        }

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>

</body>
</html>
