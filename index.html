<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Misty Poolvilla</title>

<style>

/* ===== BACKGROUND ===== */
body{
    margin:0;
    font-family:"Georgia", serif;
    background:url('images/bg.jpg') center/cover fixed no-repeat;
    color:#222;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(255,255,255,0.75);
    z-index:-1;
}

/* ===== ANIMATION ===== */
@keyframes floaty {
    0% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0); }
}

@keyframes shine {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
}

/* ===== HERO ===== */
.hero{
    text-align:center;
    padding:70px 20px 30px;
}

.hero-box{
    display:inline-block;
    padding:20px 30px;
    border-radius:15px;

    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(8px);
    box-shadow:0 10px 30px rgba(0,0,0,0.15);

    animation: floaty 4s ease-in-out infinite;
}

.hero h1{
    font-size:48px;
    letter-spacing:4px;
    margin:0;
    font-style:italic;

    background: linear-gradient(90deg, #1877F2, #06C755, #ffb347, #1877F2);
    background-size: 200% 200%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation: shine 4s linear infinite;
}

.hero p{
    margin:8px 0 0;
    font-size:14px;
    letter-spacing:2px;
    color:#333;
}

/* ===== 💎 PRICE CARD (GLASS LUXURY) ===== */
.price-card{
    max-width:450px;
    margin:30px auto;
    padding:25px;
    border-radius:20px;

    background: linear-gradient(135deg, rgba(255,255,255,0.75), rgba(255,255,255,0.35));
    backdrop-filter: blur(12px);

    border:1px solid rgba(255,255,255,0.4);

    box-shadow:
        0 20px 40px rgba(0,0,0,0.12),
        inset 0 1px 0 rgba(255,255,255,0.5);

    text-align:center;
    position:relative;
    overflow:hidden;

    animation: floaty 5s ease-in-out infinite;
}

.price-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:5px;
    background: linear-gradient(90deg, #1877F2, #06C755, #ffb347);
    box-shadow: 0 0 15px rgba(24,119,242,0.5);
}

.price-card:hover{
    transform: translateY(-8px) scale(1.01);
    box-shadow:0 25px 60px rgba(0,0,0,0.18);
}

.price-card h2{
    margin:10px 0 20px;
    font-size:22px;
}

.price-card p{
    background: rgba(255,255,255,0.8);
    margin:10px 0;
    padding:12px;
    border-radius:12px;
    box-shadow:0 6px 15px rgba(0,0,0,0.08);
    transition:0.2s;
}

.price-card p:hover{
    transform:scale(1.02);
    background: rgba(255,255,255,0.95);
}

/* badge */
.badge{
    display:inline-block;
    padding:5px 12px;
    font-size:12px;
    border-radius:20px;
    background:#111;
    color:#fff;
    margin-bottom:10px;

    animation: floaty 3s ease-in-out infinite;
}

/* ===== GALLERY ===== */
.gallery{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap:15px;
    max-width:1000px;
    margin:30px auto;
    padding:0 10px;
}

.gallery img{
    width:100%;
    border-radius:12px;
    box-shadow:0 6px 15px rgba(0,0,0,0.15);
    cursor:pointer;
    transition:0.3s;
}

.gallery img:hover{
    transform:scale(1.05) translateY(-5px);
}

/* ===== BUTTONS ===== */
.btn-group{
    text-align:center;
    margin:20px;
}

.btn{
    display:inline-block;
    padding:12px 20px;
    margin:5px;
    border-radius:8px;
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

.btn.fb{background:#1877F2;}
.btn.line{background:#06C755;}

.btn:hover{
    opacity:0.85;
    transform:translateY(-2px);
}

/* ===== CALENDAR ===== */
.calendar{
    max-width:900px;
    margin:30px auto;
    background:#fff;
    border-radius:15px;
    padding:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

iframe{
    width:100%;
    height:650px;
    border:none;
}

/* ===== LIGHTBOX ===== */
.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
}

.lightbox img{
    max-width:85%;
    max-height:80vh;
    border-radius:10px;
}

/* ===== MOBILE ===== */
@media (max-width:600px){

    .hero h1{
        font-size:30px;
    }

    .price-card{
        margin:15px;
    }

    iframe{
        height:450px;
    }
}

/* reduce motion */
@media (prefers-reduced-motion: reduce){
    *{
        animation:none !important;
        transition:none !important;
    }
}

</style>
</head>

<body>

<!-- HERO -->
<header class="hero">
    <div class="hero-box">
        <h1>Misty Poolvilla</h1>
    </div>
</header>

<!-- PRICE -->
<div class="price-card">

    <h2> ราคาที่พัก 15 ท่าน</h2>

    <p>📅 จันทร์ - พฤหัสบดี : <b>6,900 บาท</b></p>
    <p>📅 ศุกร์ - อาทิตย์ : <b>8,500 บาท</b></p>
    <p>⭐ วันเสาร์ : <b>10,000 บาท</b></p>
    <p>🎉 วันหยุดยาว : <b>13,000 บาท</b></p>

</div>

<!-- GALLERY -->
<div class="gallery">
    <img src="images/S__4276231.jpg">
    <img src="images/Screenshot 2026-06-15 154030.png">
    <img src="images/S__4268055_0.jpg">
</div>

<!-- BUTTONS -->
<div class="btn-group">
    <a class="btn fb" href="https://www.facebook.com/GoodsDeeInterTrad" target="_blank">
        📘 Facebook
    </a>

    <a class="btn line" href="https://line.me/ti/p/~YOUR_LINE_ID" target="_blank">
        💬 Line
    </a>
</div>

<!-- CALENDAR -->
<h2 style="text-align:center;">📅 ปฏิทินวันว่าง / วันจอง</h2>

<div class="calendar">
<iframe src="https://calendar.google.com/calendar/embed?src=7848fff8f64f96da3356f5681554ed8e0a9bd2cf71933aed63a58861132c449b%40group.calendar.google.com&ctz=Asia%2FBangkok"></iframe>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <img id="lightbox-img">
</div>

<script>

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

document.querySelectorAll(".gallery img").forEach(img => {
    img.addEventListener("click", () => {
        lightbox.style.display = "flex";
        lightboxImg.src = img.src;
    });
});

lightbox.addEventListener("click", () => {
    lightbox.style.display = "none";
});

</script>

</body>
</html>
