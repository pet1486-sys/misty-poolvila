<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Misty Poolvilla</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <div class="hero-box">
            <h1>Misty Poolvilla</h1>
        </div>
    </header>

    <div class="price-card">
        <h2>ราคาที่พัก 15 ท่าน</h2>
        <p><span>📅 จันทร์ - พฤหัสบดี :</span> <b>6,900 บาท</b></p>
        <p><span>📅 ศุกร์ - อาทิตย์ :</span> <b>8,500 บาท</b></p>
        <p><span>⭐ วันเสาร์ :</span> <b>10,000 บาท</b></p>
        <p><span>🎉 วันหยุดยาว :</span> <b>13,000 บาท</b></p>
    </div>

    <div class="gallery">
        <img src="images/S__4276231.jpg" alt="Poolvilla 1">
        <img src="images/Screenshot 2026-06-15 154030.png" alt="Poolvilla 2">
        <img src="images/S__4268055_0.jpg" alt="Poolvilla 3">
    </div>

    <div class="btn-group">
        <a class="btn fb" href="https://www.facebook.com/GoodsDeeInterTrad" target="_blank">
            📘 Facebook
        </a>
        <a class="btn line" href="https://line.me/ti/p/~YOUR_LINE_ID" target="_blank">
            💬 Line
        </a>
    </div>

    <h2 style="text-align:center;">📅 ปฏิทินวันว่าง / วันจอง</h2>

    <div class="calendar">
        <iframe src="https://calendar.google.com/calendar/embed?src=7848fff8f64f96da3356f5681554ed8e0a9bd2cf71933aed63a58861132c449b%40group.calendar.google.com&ctz=Asia%2FBangkok"></iframe>
    </div>

    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" alt="Enlarged view">
    </div>

    <script>
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");

        document.querySelectorAll(".gallery img").forEach(img => {
            img.addEventListener("click", () => {
                lightbox.style.display = "flex";
                lightboxImg.src = img.src;
            });
        });

        lightbox.addEventListener("click", () => {
            lightbox.style.display = "none";
        });
    </script>

</body>
</html>
