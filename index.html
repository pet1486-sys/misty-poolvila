<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misty Poolvilla</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        
        <header class="hero">
            <div class="hero-box">
                <h1>Misty Poolvilla</h1>
                <p class="sub-title">EXPERIENCE RARE LUXURY</p>
            </div>
        </header>

        <div class="content-row">
            
            <div class="slider-wrapper">
                <div class="gallery-slider" id="gallerySlider">
                    <div class="slide-item"><img src="images/S__4276231.jpg" alt="Misty Poolvilla 1" onclick="openLightbox(this.src)"></div>
                    <div class="slide-item"><img src="images/Screenshot 2026-06-15 154030.png" alt="Misty Poolvilla 2" onclick="openLightbox(this.src)"></div>
                    <div class="slide-item"><img src="images/S__4268055_0.jpg" alt="Misty Poolvilla 3" onclick="openLightbox(this.src)"></div>
                </div>
                <button class="slider-btn prev" onclick="moveSlider(-1)">&#10094;</button>
                <button class="slider-btn next" onclick="moveSlider(1)">&#10095;</button>
            </div>

            <div class="price-card">
                <h2>ราคาที่พัก 15 ท่าน</h2>
                
                <div class="room-selector">
                    <button class="room-btn active" onclick="scrollToRoom(0)">ห้องพักที่ 1</button>
                    <button class="room-btn" onclick="scrollToRoom(1)">ห้องพักที่ 2</button>
                    <button class="room-btn" onclick="scrollToRoom(2)">ห้องพักที่ 3</button>
                </div>

                <div class="price-list">
                    <p><span>📅 จันทร์ - พฤหัสบดี :</span> <b>6,900 บาท</b></p>
                    <p><span>📅 ศุกร์ - อาทิตย์ :</span> <b>8,500 บาท</b></p>
                    <p><span>⭐ วันเสาร์ :</span> <b>10,000 บาท</b></p>
                    <p><span>🎉 วันหยุดยาว :</span> <b>13,000 บาท</b></p>
                </div>
            </div>

        </div> <div class="btn-group">
            <a class="btn fb" href="https://www.facebook.com/GoodsDeeInterTrad" target="_blank">
                📘 Facebook
            </a>
            <a class="btn line" href="https://line.me/ti/p/~YOUR_LINE_ID" target="_blank">
                💬 Line
            </a>
        </div>

        <!-- 📅 เซกชันปฏิทินแสดงวันว่างและราคา (เวอร์ชันแก้ไขการเข้ารหัส URL) -->
<h2 class="calendar-title">📅 ปฏิทินวันว่าง / วันจอง </h2>
<div class="calendar">
    <!-- 
       📌 ข้อควรระวัง: 
       - ปฏิทินแรก (วันจอง): สีแดง (#e74c3c) ใช้โค้ดสีใน URL เป็น %23e74c3c
       - ปฏิทินสอง (ราคา): สีเขียว (#2ecc71) ใช้โค้ดสีใน URL เป็น %232ecc71
       - เปลี่ยนเครื่องหมาย @ ในรหัสปฏิทินอันใหม่ของคุณให้กลายเป็น %40 ด้วยนะครับ
    -->
    <iframe src="https://calendar.google.com/calendar/embed?src=7848fff8f64f96da3356f5681554ed8e0a9bd2cf71933aed63a58861132c449b%40group.calendar.google.com&amp;color=%23007fff&amp;src=114f5d0470d1d485a4710ddc0039eaf0df346f998b00d7f1600767af3f5d3f52@group.calendar.google.com&amp;color=%23e74c3c&amp;ctz=Asia%2FBangkok"></iframe>
</div>

    </div> <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Enlarged View">
    </div>
    <script>
        const slider = document.getElementById('gallerySlider');

        // ฟังก์ชันเมื่อกดปุ่ม "ห้องพักที่ 1-3" ให้เลื่อนไปที่รูปนั้นๆ
        function scrollToRoom(index) {
            const items = slider.querySelectorAll('.slide-item');
            if(items[index]) {
                const itemWidth = items[index].clientWidth + 15; // ความกว้าง + gap
                slider.scrollTo({
                    left: index * itemWidth,
                    behavior: 'smooth'
                });
                updateActiveButton(index);
            }
        }

        // ฟังก์ชันควบคุมการเลื่อนสไลเดอร์ด้วยลูกศร ซ้าย-ขวา
        function moveSlider(direction) {
            const items = slider.querySelectorAll('.slide-item');
            const itemWidth = items[0].clientWidth + 15;
            
            // คำนวณหาตำแหน่งปัจจุบันว่าอยู่รูปไหน
            let currentIndex = Math.round(slider.scrollLeft / itemWidth);
            let nextIndex = currentIndex + direction;

            if (nextIndex >= 0 && nextIndex < items.length) {
                slider.scrollTo({
                    left: nextIndex * itemWidth,
                    behavior: 'smooth'
                });
                updateActiveButton(nextIndex);
            }
        }

        // อัปเดตสีของปุ่มห้องพักให้ตรงกับภาพที่แสดงอยู่
        function updateActiveButton(index) {
            const buttons = document.querySelectorAll('.room-btn');
            buttons.forEach((btn, i) => {
                if(i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        // ตรวจจับการเลื่อนด้วยนิ้ว (Swipe) บนมือถือ เพื่อเปลี่ยนสถานะปุ่มตามจริง
        slider.addEventListener('scroll', () => {
            const items = slider.querySelectorAll('.slide-item');
            if(items.length > 0) {
                const itemWidth = items[0].clientWidth + 15;
                const currentIndex = Math.round(slider.scrollLeft / itemWidth);
                updateActiveButton(currentIndex);
            }
        });

        // ระบบ Lightbox เดิม
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
            lightboxImg.src = '';
        }

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>

</body>
</html>
